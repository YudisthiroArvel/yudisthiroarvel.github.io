<!doctype html>
<!--
  Source for public/og.png, the image shown when the site link is shared
  (LinkedIn, WhatsApp, X...). Regenerate after editing (see README → "Link preview image").
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2");
        font-weight: 300 700;
      }
      @font-face {
        font-family: "Pixelify Sans";
        src: url("../node_modules/@fontsource-variable/pixelify-sans/files/pixelify-sans-latin-wght-normal.woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2");
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0914;
        color: #f4efff;
        font-family: "Space Grotesk", sans-serif;
      }

      .glow {
        position: absolute;
        width: 900px;
        height: 900px;
        top: -520px;
        right: -260px;
        background: radial-gradient(closest-side, rgb(124 58 237 / 0.45), transparent);
      }

      .floor {
        position: absolute;
        inset: auto 0 0;
        height: 260px;
        perspective: 260px;
        perspective-origin: 50% 0%;
        overflow: hidden;
        mask-image: linear-gradient(to top, #000, transparent 90%);
        opacity: 0.55;
      }

      .floor div {
        position: absolute;
        inset: -60px -60% 0;
        background-image:
          linear-gradient(#7c3aed 2px, transparent 2px),
          linear-gradient(90deg, #7c3aed 2px, transparent 2px);
        background-size: 60px 60px;
        transform-origin: 50% 100%;
        transform: rotateX(64deg);
      }

      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgb(0 0 0 / 0.16) 0 1px, transparent 1px 3px);
      }

      .content {
        position: absolute;
        inset: 64px 72px;
        display: flex;
        flex-direction: column;
      }

      .logo {
        font-family: "Pixelify Sans", monospace;
        font-weight: 600;
        font-size: 44px;
        line-height: 1;
      }

      .logo span {
        font-size: 1.6em;
        color: #c6f432;
        text-shadow: 5px 5px 0 #7c3aed;
      }

      .prompt {
        margin-top: 40px;
        font-family: "Space Mono", monospace;
        font-size: 22px;
        color: #a78bfa;
      }

      .prompt b {
        font-weight: 400;
        color: #f4efff;
      }

      h1 {
        margin-top: 18px;
        font-size: 76px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      h1 em {
        font-family: "Pixelify Sans", monospace;
        font-style: normal;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #c6f432;
        text-shadow: 4px 4px 0 #7c3aed;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: auto;
        font-family: "Space Mono", monospace;
        font-size: 20px;
        color: #aba2c6;
      }

      .url {
        padding: 10px 16px;
        border: 2px solid #c6f432;
        border-radius: 4px;
        background: #c6f432;
        color: #0c0914;
        box-shadow: 5px 5px 0 #7c3aed;
      }

      .sticker {
        position: absolute;
        top: 70px;
        right: 80px;
        padding: 10px 18px;
        border: 3px solid #0c0914;
        border-radius: 4px;
        background: #ff7ac6;
        color: #0c0914;
        font-family: "Pixelify Sans", monospace;
        font-size: 26px;
        font-weight: 600;
        rotate: 6deg;
        box-shadow: 4px 4px 0 #0c0914;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="floor"><div></div></div>
    <div class="scanlines"></div>

    <span class="sticker">open_to_work ★</span>

    <div class="content">
      <p class="logo"><span>A</span>rvel</p>
      <p class="prompt">arvel@binus:~$ <b>whoami</b></p>
      <h1>Software engineer by major.<br /><em>AI nerd</em> by choice.</h1>
      <div class="footer">
        <span>Software Engineering · BINUS University</span>
        <span class="url">yudisthiroarvel.github.io</span>
      </div>
    </div>
  </body>
</html>
